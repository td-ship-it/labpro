# Cấu hình Cloudflare Worker cho LabLog Pro.
# Tên Worker phải TRÙNG với tên bạn đặt trên Cloudflare (Workers & Pages).
name = "lablog-pro"
main = "worker/index.js"
compatibility_date = "2026-10-01"
# Giữ nguyên các biến/secret đã đặt trên dashboard Cloudflare khi deploy
keep_vars = true

# Cloudflare tự chạy lệnh này (build giao diện React vào dist/) trước khi deploy
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]

# (Tùy chọn) Đánh thức Apps Script 5 phút/lần, 7h–18h thứ 2–7 (giờ VN = UTC+7) để đăng nhập luôn nhanh.
# Gói miễn phí chỉ có 5 lịch (Cron) cho cả tài khoản Cloudflare — bỏ dấu # nếu còn suất.
# [triggers]
# crons = ["*/5 0-11 * * 1-6"]

# Trợ lý AI miễn phí: Cloudflare Workers AI (~10.000 neuron/ngày, đặt lại 7h sáng giờ VN).
# Đổi model bằng biến AI_MODEL trên dashboard nếu muốn.
[ai]
binding = "AI"

[observability]
enabled = true
